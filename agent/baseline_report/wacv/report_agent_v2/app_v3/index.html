<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>丰谷智警 · 低产风险预警工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">丰</div>
        <div class="brand-text">
          <strong>丰谷智警</strong>
          <span>低产风险预警工作台</span>
        </div>
      </div>
      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-view="dashboard"><span class="nav-ico">总</span>总览</button>
        <button class="nav-item" data-view="alerts"><span class="nav-ico">警</span>告警工作台<span id="alertBadge" class="nav-badge hidden"></span></button>
        <button class="nav-item" data-view="reports"><span class="nav-ico">报</span>报告中心</button>
        <button class="nav-item" data-view="fields"><span class="nav-ico">田</span>田块空间</button>
        <button class="nav-item" data-view="value"><span class="nav-ico">值</span>价值评估</button>
        <button class="nav-item" data-view="tasks"><span class="nav-ico">巡</span>现场任务</button>
        <button class="nav-item" data-view="knowledge"><span class="nav-ico">知</span>知识库</button>
        <button class="nav-item" data-view="audit"><span class="nav-ico">审</span>审计记录</button>
        <button class="nav-item" data-view="retrospective"><span class="nav-ico">回</span>回顾审计</button>
        <button class="nav-item" data-view="settings"><span class="nav-ico">设</span>系统设置</button>
      </nav>
      <div class="sidebar-foot">
        <div id="modeBadge" class="mode-badge">正在连接…</div>
        <div id="userChip" class="user-chip">未登录</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="page-head">
          <h1 id="pageTitle">总览</h1>
          <p id="pageSubtitle" class="page-subtitle">加载中…</p>
        </div>
        <div class="topbar-actions">
          <span id="disclosureChip" class="disclosure-chip">冻结审计演示数据</span>
          <button id="demoTourButton" class="button primary" type="button">开始演示导览</button>
          <button id="refreshButton" class="button ghost" type="button">刷新数据</button>
        </div>
      </header>
      <main id="viewRoot" class="view-root" aria-live="polite"></main>
    </div>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <div id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-label="田块详情"></div>
  <dialog id="tourDialog" class="tour-dialog">
    <div class="tour-head">
      <span id="tourStepLabel" class="tour-step">第 1 / 6 步</span>
      <button id="closeTourButton" class="tour-close" type="button" aria-label="关闭导览">×</button>
    </div>
    <h2 id="tourTitle"></h2>
    <p id="tourDescription"></p>
    <div class="tour-actions">
      <button id="tourBackButton" class="button" type="button">上一步</button>
      <button id="tourGoButton" class="button primary" type="button">前往查看</button>
      <button id="tourNextButton" class="button primary" type="button">下一步</button>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
